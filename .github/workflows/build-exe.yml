name: Build SecurityScanner.exe

on:
  push:
    tags:
      - "v*"          # trigger on version tags like v1.0.0
  workflow_dispatch:  # also allow manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller>=6.0

      - name: Build executable
        run: pyinstaller security_scanner.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityScanner
          path: dist\SecurityScanner.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\SecurityScanner.exe
          name: Security Scanner ${{ github.ref_name }}
          body: |
            ## Windows 11 Security Settings Scanner

            **Download `SecurityScanner.exe` below and double-click to run.**
            Windows will prompt for Administrator privileges automatically.

            ### What it scans
            - Windows Defender (7 settings)
            - Windows Firewall (Domain / Private / Public)
            - UAC, SmartScreen, Windows Update, Defender Service
            - Remote Desktop, Remote Registry

            ### Requirements
            - Windows 11 (also works on Windows 10)
            - No Python installation needed — fully standalone
